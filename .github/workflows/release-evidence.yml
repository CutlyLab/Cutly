name: Restricted RC release evidence

on:
  workflow_dispatch:
    inputs:
      profile:
        description: Restricted RC smoke or repeated-job long observation (not broad M4 acceptance)
        type: choice
        required: true
        default: smoke
        options:
          - smoke
          - long

permissions:
  contents: read

jobs:
  evidence:
    name: RC evidence on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 110
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Linux media test runtime
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Install macOS media test runtime
        if: runner.os == 'macOS'
        run: brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg

      - name: Collect restricted RC evidence
        shell: bash
        env:
          EVIDENCE_PROFILE: ${{ inputs.profile }}
        run: |
          go run ./internal/cmd/release-evidence \
            --profile "${EVIDENCE_PROFILE}" \
            --output "${RUNNER_TEMP}/rc-release-evidence.json"

      - name: Retain evidence including failure reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restricted-rc-evidence-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/rc-release-evidence.json
          if-no-files-found: warn
          retention-days: 14
