name: Cutly release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release identity and source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
          cache: false

      - name: Install media test runtime
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg

      - name: Require one version across tag, Go and npm
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          go_version="$(go run ./cmd/cutly version | awk '{print $2}')"
          npm_version="$(node -p 'require("./sdk/typescript/package.json").version')"
          test "${GITHUB_REF_NAME}" = "v${version}"
          test "${version}" = "${go_version}"
          test "${version}" = "${npm_version}"
          test "${version}" != "0.1.0-dev"

      - name: Verify module and public packages
        run: |
          go mod tidy -diff
          go vet ./...
          go test -race -count=1 ./...
          npm --prefix sdk/typescript test
          npm --prefix sdk/typescript run pack:check -- --cache "${RUNNER_TEMP}/cutly-npm-cache"

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runtime_fingerprint_var: CUTLY_MEDIA_RUNTIME_FINGERPRINT_LINUX_AMD64
          - goos: linux
            goarch: arm64
            runtime_fingerprint_var: CUTLY_MEDIA_RUNTIME_FINGERPRINT_LINUX_ARM64
          - goos: darwin
            goarch: amd64
            runtime_fingerprint_var: CUTLY_MEDIA_RUNTIME_FINGERPRINT_DARWIN_AMD64
          - goos: darwin
            goarch: arm64
            runtime_fingerprint_var: CUTLY_MEDIA_RUNTIME_FINGERPRINT_DARWIN_ARM64
          - goos: windows
            goarch: amd64
            runtime_fingerprint_var: CUTLY_MEDIA_RUNTIME_FINGERPRINT_WINDOWS_AMD64
          - goos: freebsd
            goarch: amd64
            runtime_fingerprint_var: CUTLY_MEDIA_RUNTIME_FINGERPRINT_FREEBSD_AMD64
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Download locked build dependencies
        run: go mod download

      - name: Build and inspect command archives
        shell: bash
        env:
          TARGET_GOOS: ${{ matrix.goos }}
          TARGET_GOARCH: ${{ matrix.goarch }}
          MEDIA_RUNTIME_FINGERPRINT: ${{ vars[matrix.runtime_fingerprint_var] }}
          MEDIA_RUNTIME_TRUSTED_KEYS: ${{ vars.CUTLY_MEDIA_RUNTIME_TRUSTED_KEYS }}
        run: |
          test -n "${MEDIA_RUNTIME_FINGERPRINT}"
          test -n "${MEDIA_RUNTIME_TRUSTED_KEYS}"
          version="${GITHUB_REF_NAME#v}"
          smoke=()
          if [[ "${TARGET_GOOS}/${TARGET_GOARCH}" = "$(go env GOOS)/$(go env GOARCH)" ]]; then
            smoke=(--smoke)
          fi
          go run ./internal/cmd/release-archive \
            --repo . \
            --target "${TARGET_GOOS}/${TARGET_GOARCH}" \
            --output "${RUNNER_TEMP}" \
            --version "${version}" \
            --media-runtime-bundle-fingerprint "${MEDIA_RUNTIME_FINGERPRINT}" \
            --media-runtime-trusted-keys "${MEDIA_RUNTIME_TRUSTED_KEYS}" \
            "${smoke[@]}"

      - name: Upload command archive
        uses: actions/upload-artifact@v4
        with:
          name: cutly-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/cutly-*-${{ matrix.goos }}-${{ matrix.goarch }}.*
          if-no-files-found: error
          retention-days: 7

  native-acceptance:
    name: Native acceptance ${{ matrix.goos }}/${{ matrix.goarch }}
    needs:
      - verify
      - build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            kit_url_var: CUTLY_ACCEPTANCE_KIT_URL_LINUX_AMD64
            kit_sha_var: CUTLY_ACCEPTANCE_KIT_SHA256_LINUX_AMD64
          - runner: macos-14
            goos: darwin
            goarch: amd64
            kit_url_var: CUTLY_ACCEPTANCE_KIT_URL_DARWIN_AMD64
            kit_sha_var: CUTLY_ACCEPTANCE_KIT_SHA256_DARWIN_AMD64
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false

      - name: Download packaged commands
        uses: actions/download-artifact@v8
        with:
          name: cutly-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ runner.temp }}/commands

      - name: Download owner-approved signed acceptance kit
        shell: bash
        env:
          KIT_URL: ${{ vars[matrix.kit_url_var] }}
          KIT_SHA256: ${{ vars[matrix.kit_sha_var] }}
        run: |
          test -n "${KIT_URL}"
          test -n "${KIT_SHA256}"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "${RUNNER_TEMP}/acceptance-kit.tar.gz" "${KIT_URL}"
          actual_sha="$(shasum -a 256 "${RUNNER_TEMP}/acceptance-kit.tar.gz" | awk '{print $1}')"
          test "${actual_sha}" = "${KIT_SHA256}"
          mkdir "${RUNNER_TEMP}/acceptance-kit" "${RUNNER_TEMP}/commands-unpacked"
          tar -xzf "${RUNNER_TEMP}/acceptance-kit.tar.gz" -C "${RUNNER_TEMP}/acceptance-kit"
          tar -xzf "${RUNNER_TEMP}/commands/"*.tar.gz -C "${RUNNER_TEMP}/commands-unpacked"

      - name: Run mixed smoke, 100 daemon kills and one-hour soak
        shell: bash
        run: |
          command_root="$(find "${RUNNER_TEMP}/commands-unpacked" -mindepth 1 -maxdepth 1 -type d -name 'cutly-*' -print -quit)"
          kit_root="${RUNNER_TEMP}/acceptance-kit"
          test -x "${command_root}/cutlyd"
          test -x "${command_root}/cutly-worker-v2"
          test -d "${kit_root}/runtime-bundle"
          test -f "${kit_root}/environment.json"
          test -f "${kit_root}/host-config.json"
          test -f "${kit_root}/sdk-digest.txt"
          export CUTLY_TEST_NATIVE_DAEMON="${command_root}/cutlyd"
          export CUTLY_TEST_NATIVE_WORKER="${command_root}/cutly-worker-v2"
          export CUTLY_TEST_NATIVE_RUNTIME_BUNDLE="${kit_root}/runtime-bundle"
          export CUTLY_TEST_NATIVE_ENVIRONMENT="${kit_root}/environment.json"
          export CUTLY_TEST_NATIVE_HOST_CONFIG="${kit_root}/host-config.json"
          export CUTLY_TEST_NATIVE_SDK_DIGEST="$(tr -d '\r\n' < "${kit_root}/sdk-digest.txt")"
          for mode in smoke fault100 soak; do
            CUTLY_TEST_NATIVE_ACCEPTANCE="${mode}" go test -count=1 -run '^TestNativeV2ProcessAcceptance$' ./cmd/cutlyd
          done

  publish-npm:
    name: Publish npm package with provenance
    needs:
      - verify
      - build
      - native-acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: https://registry.npmjs.org
          cache: false

      - name: Publish public SDK
        working-directory: sdk/typescript
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          dist_tag="latest"
          if [[ "${version}" = *-* ]]; then dist_tag="rc"; fi
          npm publish --access public --provenance --tag "${dist_tag}"

  release:
    name: Publish checksummed GitHub release
    needs:
      - build
      - publish-npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download command archives
        uses: actions/download-artifact@v8
        with:
          pattern: cutly-*
          path: dist
          merge-multiple: true

      - name: Create SHA-256 manifest
        shell: bash
        run: |
          cd dist
          sha256sum cutly-* > SHA256SUMS

      - name: Attest release archives
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/cutly-*

      - name: Create GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          prerelease=""
          if [[ "${version}" = *-* ]]; then prerelease="--prerelease"; fi
          gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --generate-notes --title "Cutly ${version}" ${prerelease}
